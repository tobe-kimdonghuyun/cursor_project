# =============================================================================
# NexaLAP Server - Application Configuration
# =============================================================================
#
# This file is organized into two sections:
#   1) Non-user-configurable : Internal server structure values. Editing these
#      may break server startup or conflict with other settings, so they
#      should not be modified as a rule.
#   2) User-configurable     : Values that must be set or adjusted to match
#      the deployment environment (port, session store, secret keys, etc.)
# =============================================================================


# =============================================================================
# 1. Non-user-configurable (internal server structure values - do not modify)
# =============================================================================

# -----------------------------------------------------------------------------
# Server internal paths
# -----------------------------------------------------------------------------
server.base-path=${NEXALAPSERVER_HOME}
server.base.repository=${NEXALAPSERVER_HOME}/repository
server.execute.url=NexaLAPServer::api/v1/execute

# -----------------------------------------------------------------------------
# Config & Logging load paths
# -----------------------------------------------------------------------------
logging.config=${NEXALAPSERVER_HOME}/config/log4j2.xml
spring.banner.location=file:${NEXALAPSERVER_HOME}/config/banner.txt

# -----------------------------------------------------------------------------
# Messages
# -----------------------------------------------------------------------------
spring.messages.basename=messages/message-common

# -----------------------------------------------------------------------------
# DataSource internal init flags
# -----------------------------------------------------------------------------
systemenv.datasource=true
spring.sql.init.mode=never


# =============================================================================
# 2. User-configurable (set according to your deployment environment)
# =============================================================================

# -----------------------------------------------------------------------------
# Server
# -----------------------------------------------------------------------------
server.port=8080

# -----------------------------------------------------------------------------
# Session
# -----------------------------------------------------------------------------
server.servlet.session.cookie.same-site=lax
server.servlet.session.cookie.secure=false

# Session Store : none | redis | jdbc
spring.session.store-type=none

# Redis Session (enable when spring.session.store-type=redis)
#spring.session.redis.flush-mode=
#spring.session.redis.namespace=
#server.servlet.session.timeout=
#spring.data.redis.host=
#spring.data.redis.port=
#spring.data.redis.password=
#spring.data.redis.timeout=

# JDBC Session (enable when spring.session.store-type=jdbc)
#spring.session.jdbc.initialize-schema=always
#spring.session.jdbc.table-name=NEXALAP_SESSION
#spring.session.jdbc.cleanup-cron=0 */5 * * * *
#server.servlet.session.timeout=
#server.session.datasource.driver-class-name=
#server.session.datasource.url=
#server.session.datasource.username=
#server.session.datasource.password=
#server.session.datasource.platform=

# -----------------------------------------------------------------------------
# OAuth2 Token Encryption
# -----------------------------------------------------------------------------
# AES-256, 32 bytes, Base64URL. Generate with nexalap-server-web/bin/generate-secret-key.sh (or .bat)
oauth2.token.encrypt.key=

# Token store: none | redis | db
oauth2.token.store.type=none

# Redis token store (enable when oauth2.token.store.type=redis; reuses spring.data.redis.* above)
#oauth2.token.store.type=redis

# DB token store (enable when oauth2.token.store.type=db)
#oauth2.token.store.type=db
#oauth2.token.datasource.driver-class-name=
#oauth2.token.datasource.url=
#oauth2.token.datasource.username=
#oauth2.token.datasource.password=
#oauth2.token.datasource.platform=auto

# -----------------------------------------------------------------------------
# SAML SSO
# -----------------------------------------------------------------------------
# SP keystore password (protects config/saml/{projectId}/sp-keystore.p12)
saml.keystore.password=

# -----------------------------------------------------------------------------
# PlatformData Reauth Token Signing
# -----------------------------------------------------------------------------
# HMAC-SHA256, 32 bytes, Base64URL. Generate with nexalap-server-web/bin/generate-secret-key.sh (or .bat)
# Blank = random per-instance key (single-server only). Multi-instance/load-balanced
# deployments MUST set the same value on every instance, or token verification will
# fail unpredictably.
platformdata.reauth.token.secret-key=

# -----------------------------------------------------------------------------
# PlatformData Credential Encryption
# -----------------------------------------------------------------------------
# AES-256, 32 bytes, Base64URL. Generate with nexalap-server-web/bin/generate-secret-key.sh (or .bat)
# Encrypts datasource credentialbinding literal values (e.g. service-account password) at rest.
# Blank = credentialbinding stored as plaintext (fallback, no startup failure).
# Separate key from oauth2.token.encrypt.key by design (independent key management per connector).
platformdata.credential.encrypt.key=
